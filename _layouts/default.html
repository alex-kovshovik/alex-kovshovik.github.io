<!DOCTYPE html>
<html lang="{{ page.lang | default: site.lang | default: "en" }}">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <script>document.documentElement.classList.add("js");</script>
    {%- seo -%}
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap">
    <link rel="stylesheet" href="{{ "/assets/css/style.css" | relative_url }}">
    <link rel="icon" href="{{ "/favicon.ico" | relative_url }}" sizes="any">
    <link rel="icon" type="image/png" sizes="32x32" href="{{ "/assets/favicon-32.png" | relative_url }}">
    <link rel="icon" type="image/png" sizes="192x192" href="{{ "/assets/favicon-192.png" | relative_url }}">
    <link rel="apple-touch-icon" href="{{ "/apple-touch-icon.png" | relative_url }}">
    {%- feed_meta -%}
  </head>
  <body class="layout-{{ page.layout }}">
    {%- include header.html -%}
    <main id="main">
      {{ content }}
    </main>
    {%- include footer.html -%}
    <script src="{{ "/assets/js/site.js" | relative_url }}" defer></script>
  </body>
</html>
